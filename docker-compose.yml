services:
  mc-daemon:
    build: .
    container_name: mc_daemon
    restart: unless-stopped
    ports:
      - "7110:7110"
      - "25565:25565"
    environment:
      - RUN_MODE=prod
    volumes:
      - ./runtime/server:/app/server
      - ./config/prod.toml:/app/config/prod.toml
    deploy:
      resources:
        limits:
          memory: 6G
