[package]
name = "mcprocess"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.39", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
flate2 = "1.0"      # Para compresión Gzip
tar = "0.4"         # Para crear el archivo .tar
chrono = "0.4"
thiserror = "2.0"
dunce = "1.0"
regex = "1.12"
sysinfo = "0.37.2"

[dev-dependencies]
tempfile = "3" # Muy recomendado para crear carpetas temporales y borrarlas al acabar
