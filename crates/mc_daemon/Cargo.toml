[package]
name = "mc_daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
# Tokio
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }

# Async
futures = "0.3"

# Logs
tracing = "0.1"
tracing-subscriber = "0.3"

# Serde
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Errors
anyhow = "1.0"

# Process inspection (orphan recovery)
sysinfo = "0.37.2"
dunce = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation"] }

# McServer
mc_process = { path = "../mc_process" }
mc_config = { path = "../mc_config" }
mc_types = { path = "../mc_types" }
