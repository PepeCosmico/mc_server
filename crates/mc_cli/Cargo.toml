[package]
name = "mc_cli"
version = "0.1.0"
edition = "2024"

[dependencies]
# Cli
clap = { version = "4.4", features = ["derive"] }

# Async
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"

# Config
config = "0.14"

# Logs
indicatif = "0.18"
colored = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Error
thiserror = "2.0"

#Serialize
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# McServer
mc_process = { path = "../mc_process" }
mc_config = { path = "../mc_config" }
