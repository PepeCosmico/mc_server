[package]
name = "mc_process"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48", features = ["full"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.9.8"
chrono = "0.4"
thiserror = "2.0"
dunce = "1.0"
regex = "1.12"
sysinfo = "0.37.2"

mc_config = { path = "../mc_config" }
mc_types = { path = "../mc_types" }

[dev-dependencies]
tempfile = "3"
